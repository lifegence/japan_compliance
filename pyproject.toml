[project]
name = "japan_compliance"
authors = [
    { name = "Lifegence Corporation", email = "contact@lifegence.com" },
]
description = "Japanese accounting, consumption tax, qualified invoice and statutory bookkeeping compliance for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-or-later"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
